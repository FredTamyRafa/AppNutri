<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutriTrack - Cardápios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="dados.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-20">
    <div class="max-w-md mx-auto bg-gray-50 min-h-screen relative shadow-2xl overflow-x-hidden">
        
        <header class="bg-emerald-600 text-white p-5 rounded-b-3xl shadow-lg relative z-10">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-2xl font-bold">NutriTrack V8</h1>
                    <p class="text-emerald-100 text-sm">Metabolismo Acelerado (1350 kcal)</p>
                </div>
                <div class="w-12 h-12 rounded-full bg-white text-emerald-600 flex items-center justify-center shadow-inner">
                    <i class="ph-fill ph-lightning text-3xl"></i>
                </div>
            </div>
            
            <div class="bg-white/20 p-4 rounded-xl backdrop-blur-sm">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-sm font-medium">Calorias Hoje</span>
                    <span class="text-lg font-bold"><span id="caloriasAtuais">0</span> / 1350 kcal</span>
                </div>
                <div class="w-full bg-emerald-900/30 rounded-full h-3 mb-4">
                    <div id="barraProgresso" class="bg-white h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-white/30 rounded p-1">
                        <p class="text-[9px] uppercase font-bold text-emerald-100">Proteína</p>
                        <p class="text-sm font-black"><span id="protAtual">0</span><span class="text-[10px] font-normal">/130g</span></p>
                    </div>
                    <div class="bg-white/30 rounded p-1">
                        <p class="text-[9px] uppercase font-bold text-emerald-100">Carboidrato</p>
                        <p class="text-sm font-black"><span id="carbAtual">0</span><span class="text-[10px] font-normal">/120g</span></p>
                    </div>
                    <div class="bg-white/30 rounded p-1">
                        <p class="text-[9px] uppercase font-bold text-emerald-100">Gordura</p>
                        <p class="text-sm font-black"><span id="gordAtual">0</span><span class="text-[10px] font-normal">/40g</span></p>
                    </div>
                </div>
            </div>
        </header>

        <main class="p-4">
            <div class="flex items-center justify-between mb-4 space-x-2">
                <h2 class="text-xl font-bold text-gray-800 whitespace-nowrap">Cardápio</h2>
                <div class="flex space-x-2 w-full justify-end">
                    <select id="seletorCiclo" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block p-2 shadow-sm outline-none w-1/3" onchange="atualizarSeletorMenus()">
                        <option value="ciclo1">Ciclo 1</option>
                        <option value="ciclo2" selected>Ciclo 2</option>
                    </select>
                    <select id="seletorMenu" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block p-2 shadow-sm outline-none w-2/3" onchange="renderizarCardapio()"></select>
                </div>
            </div>
            <div id="listaRefeicoes" class="space-y-4 pb-4"></div>
        </main>

        <nav class="fixed bottom-0 w-full max-w-md bg-white/90 backdrop-blur-md border-t border-gray-200 flex justify-between items-center pb-safe pt-2 pb-2 px-1 z-50">
            <a href="index.html" class="flex flex-col items-center p-2 text-emerald-600 w-1/4">
                <i class="ph-fill ph-fork-knife text-2xl mb-1"></i><span class="text-[10px] font-semibold">Cardápios</span>
            </a>
            <a href="memoria.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-emerald-600 w-1/4 transition-colors">
                <i class="ph ph-notebook text-2xl mb-1"></i><span class="text-[10px] font-semibold">Memória</span>
            </a>
            <a href="compras.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-emerald-600 w-1/4 transition-colors">
                <i class="ph ph-shopping-cart text-2xl mb-1"></i><span class="text-[10px] font-semibold">Compras</span>
            </a>
            <a href="planilha.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-emerald-600 w-1/4 transition-colors">
                <i class="ph ph-chart-line-up text-2xl mb-1"></i><span class="text-[10px] font-semibold">Planilha</span>
            </a>
        </nav>
    </div>

    <script>
        window.onload = () => {
            atualizarProgressoDiarioGlobais();
            atualizarSeletorMenus();
        };

        function atualizarSeletorMenus() {
            const cicloId = document.getElementById('seletorCiclo').value;
            const seletorMenu = document.getElementById('seletorMenu');
            seletorMenu.innerHTML = ciclosData[cicloId].map(menu => `<option value="${menu.value}">${menu.text}</option>`).join('');
            renderizarCardapio();
        }

        function renderizarCardapio() {
            const menuId = document.getElementById('seletorMenu').value;
            const fallbackId = document.getElementById('seletorCiclo').value === 'ciclo1' ? "1" : "13";
            const refeicoes = menusData[menuId] || menusData[fallbackId];
            
            document.getElementById('listaRefeicoes').innerHTML = refeicoes.map(ref => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="h-36 w-full relative">
                        <img src="${ref.img}" alt="${ref.title}" class="w-full h-full object-cover">
                        <div class="absolute bottom-0 w-full bg-gradient-to-t from-black/80 to-transparent p-3 pt-10">
                            <span class="text-white text-xs font-bold px-2 py-1 bg-emerald-600 rounded-lg shadow-sm">${ref.id}</span>
                            <span class="text-white font-bold ml-2">${ref.title} <span class="font-normal text-emerald-200 ml-1 text-sm"><i class="ph ph-clock"></i> ${ref.time}</span></span>
                        </div>
                    </div>
                    <div class="p-4">
                        <p class="text-gray-700 text-sm leading-relaxed mb-3">${ref.desc}</p>
                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-2 mb-3">
                            <p class="text-[10px] uppercase font-bold text-gray-500 mb-1 tracking-wider"><i class="ph-fill ph-chart-pie-slice"></i> Referência Macros</p>
                            <p class="text-xs text-gray-700 font-medium">${ref.nutri}</p>
                        </div>
                        <div class="inline-flex items-center bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg text-xs font-semibold w-full border border-blue-100">
                            <i class="ph-fill ph-pill mr-2 text-lg"></i>${ref.supp}
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
